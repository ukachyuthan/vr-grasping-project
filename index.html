<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grasp Demonstrator</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0b0f14; color: #cfe8ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
      canvas { display: block; }
      #overlay {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
        padding: 1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(transparent, rgba(11, 15, 20, 0.95) 35%);
        text-align: center; pointer-events: none;
      }
      #overlay > * { pointer-events: auto; }
      #overlay h1 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.08em; }
      #enter-xr { font: inherit; font-size: 1rem; padding: 0.8rem 2rem; color: #0b0f14; background: #4fd1ff; border: none; border-radius: 4px; cursor: pointer; }
      #enter-xr:disabled { background: #2a3540; color: #6b7c8c; cursor: not-allowed; }
      #status { font-size: 0.8rem; color: #6b8ca8; max-width: 36rem; line-height: 1.6; }
      #case-status { position: fixed; top: 1rem; left: 1rem; font: inherit; font-size: 0.85rem; line-height: 1.6; color: #4fd1ff; white-space: pre-wrap; max-width: calc(100vw - 2rem); }
    </style>
  </head>
  <body>
    <pre id="case-status"></pre>
    <div id="overlay">
      <h1>GRASP DEMONSTRATOR</h1>
      <button id="enter-xr" disabled>Checking WebXR…</button>
      <p id="status">Open this page in the Meta Quest Browser on a Quest 3.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
